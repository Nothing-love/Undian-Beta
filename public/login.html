<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DOORPRIZE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026.08.19.4">
  <style>
    /* Login pintu masuk — bahasa desain HUD (tema komando/gelap-merah, senada Dashboard).
       app.js tak jalan di sini (pra-login) → set token tema komando inline. UI-only. */
    :root {
      --color-primary:#DC2626; --color-primary-light:#F04444; --color-primary-dark:#B01B1B; --color-primary-rgb:220,38,38;
      --color-secondary:#7F1D1D; --color-secondary-rgb:127,29,29;
      --color-accent:#F97316; --color-accent-rgb:249,115,22;
      --color-bg:#0A0E15; --color-bg-secondary:#0F141D; --color-surface:#111826;
      --color-text:#E9EEF6; --color-text-secondary:#B3C1D1; --color-text-muted:#7F93A8; --color-border:#1F2A3A;
      --font-display:'Bebas Neue','Oswald',sans-serif; --font-tech:'Rajdhani','Segoe UI',sans-serif;
      --font-number:'Teko','Oswald',sans-serif; --font-ui:'Inter','Segoe UI',sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
      font-family: var(--font-ui); color: var(--color-text); position: relative;
      background:
        radial-gradient(58% 78% at 50% 30%, rgba(var(--color-primary-rgb),.13), transparent 60%),
        radial-gradient(50% 60% at 88% 92%, rgba(var(--color-primary-rgb),.10), transparent 62%),
        linear-gradient(160deg, #05080d, var(--color-bg));
    }
    body::before {
      content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
      background-image:
        linear-gradient(rgba(233,238,246,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(233,238,246,.05) 1px, transparent 1px);
      background-size: 46px 46px, 46px 46px;
      -webkit-mask-image: radial-gradient(120% 100% at 50% 40%, #000 18%, transparent 90%);
              mask-image: radial-gradient(120% 100% at 50% 40%, #000 18%, transparent 90%);
    }
    body::after {
      content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .32;
      background: repeating-linear-gradient(0deg, rgba(233,238,246,.05) 0 2px, transparent 2px 4px);
    }

    .login-box {
      position: relative; z-index: 2; width: 100%; max-width: 410px; padding: 46px 38px 34px; text-align: center;
      background: linear-gradient(160deg, var(--color-surface), #0c121d);
      border: 1.5px solid rgba(var(--color-primary-rgb),.5);
      clip-path: polygon(0 20px, 20px 0, calc(100% - 26px) 0, 100% 26px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 26px 100%, 0 calc(100% - 26px));
      box-shadow: 0 26px 64px -22px rgba(0,0,0,.75), 0 0 44px rgba(var(--color-primary-rgb),.16);
    }
    .cnr { position: absolute; width: 22px; height: 22px; z-index: 3; border: 2px solid var(--color-primary-light);
      filter: drop-shadow(0 0 3px rgba(var(--color-primary-rgb),.7)); pointer-events: none; }
    .cnr.tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
    .cnr.tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
    .cnr.bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
    .cnr.br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

    .login-eyebrow { font-family: var(--font-tech); font-weight: 600; font-size: .72rem; letter-spacing: .32em; text-transform: uppercase; color: var(--color-primary-light); margin-bottom: 8px; }
    .login-box h1 { font-family: var(--font-display); font-weight: 400; font-size: 3rem; line-height: 1; letter-spacing: .06em; color: var(--color-primary-light);
      text-shadow: 0 0 28px rgba(var(--color-primary-rgb),.5); margin: 0 0 3px; }
    .login-sub { font-family: var(--font-tech); font-weight: 600; font-size: .82rem; letter-spacing: .3em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 26px; }

    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 7px; font-family: var(--font-tech); font-weight: 600; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-secondary); }
    .form-control {
      width: 100%; padding: 12px 14px; font-family: var(--font-ui); font-size: 1rem; color: var(--color-text);
      background: var(--color-bg); border: 1px solid var(--color-border);
      clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary), 0 0 16px rgba(var(--color-primary-rgb),.3); }
    .form-control::placeholder { color: var(--color-text-muted); }

    .btn-login {
      width: 100%; margin-top: 22px; padding: 13px; cursor: pointer; border: 0;
      font-family: var(--font-number); font-weight: 600; font-size: 1.55rem; line-height: 1; letter-spacing: .14em; text-transform: uppercase; color: #fff;
      background: linear-gradient(180deg, var(--color-primary-light), var(--color-primary) 55%, var(--color-primary-dark));
      clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
      box-shadow: 0 10px 26px -8px rgba(var(--color-primary-rgb),.7), inset 0 2px 0 rgba(255,255,255,.25);
      transition: filter .2s, transform .08s;
    }
    .btn-login:hover { filter: brightness(1.08); }
    .btn-login:active { transform: translateY(1px); }

    .error-msg {
      display: none; margin-bottom: 18px; padding: 10px 12px; font-family: var(--font-tech); font-weight: 600; font-size: .82rem; letter-spacing: .03em;
      color: #fff; background: rgba(var(--color-primary-rgb),.18); border: 1px solid rgba(var(--color-primary-rgb),.6);
      clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    }
    .login-foot { margin-top: 24px; font-family: var(--font-tech); font-weight: 600; font-size: .64rem; letter-spacing: .28em; text-transform: uppercase; color: var(--color-text-muted); }
    .login-foot b { color: var(--color-primary-light); font-weight: 700; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="login-box">
    <span class="cnr tl"></span><span class="cnr tr"></span><span class="cnr bl"></span><span class="cnr br"></span>
    <div class="login-eyebrow">Sistem Undian Digital</div>
    <h1>DOORPRIZE</h1>
    <div class="login-sub">Masuk Operator</div>
    <div class="error-msg" id="errorMsg">Username atau Password salah!</div>
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-login">Masuk</button>
    </form>
    <div class="login-foot">Powered by <b>Satsiber Kopassus</b></div>
  </div>
  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
