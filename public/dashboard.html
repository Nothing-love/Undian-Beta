  <!-- Fit judul & sub-judul ke SATU baris (auto-kecilkan font utk kalimat panjang) — UI-only, tak sentuh logika undian. -->
  <script>
  (function(){
    var _stg = document.getElementById('stage');
    function _custom(){ return !!(_stg && _stg.classList.contains('stage-custom')); }
    function fit(el, sizePx, minPx, maxW){
      if(!el) return;
      // HIBRID (user 2026-08-21): HORMATI ukuran pilihan user (slider Setting = ukuran nyata, bukan sekadar batas).
      // Teks panjang MEMBUNGKUS sampai maks 2 baris pada ukuran itu; baru auto-KECIL bila MASIH luber (>2 baris).
      // Kata sangat panjang dipecah (break-word) agar tak menonjol keluar kotak. overflow:visible → baris ke-2 terlihat.
      el.style.setProperty('white-space','normal','important');
      el.style.setProperty('overflow-wrap','break-word','important');
      el.style.setProperty('overflow','visible','important');
      var cst = _custom();
      // Custom: kotak (clientWidth) yang membatasi bungkus. Biasa: bungkus dalam maxW (banner tumbuh vertikal, bukan mengecil).
      if(!cst) el.style.setProperty('max-width', maxW+'px','important'); else el.style.removeProperty('max-width');
      var MAXLINES = 2, s = sizePx, g = 0;
      // Hitung baris ter-RENDER via Range.getClientRects (dikelompokkan per posisi 'top') — paling ANDAL:
      // mengukur baris NYATA hasil pembungkusan word-boundary (tak terpengaruh quirk flex/scrollHeight).
      function renderedLines(){
        el.style.setProperty('font-size', s+'px','important');
        try{
          var range=document.createRange(); range.selectNodeContents(el);
          var rects=range.getClientRects(), tops={}, n=0;
          for(var i=0;i<rects.length;i++){ var k=Math.round(rects[i].top); if(!(k in tops)){ tops[k]=1; n++; } }
          return n||1;
        }catch(e){ return 1; }
      }
      // Kecilkan hanya bila teks BENAR-BENAR ter-render lebih dari 2 baris pada ukuran ini.
      while(renderedLines() > MAXLINES && s > minPx && g < 300){ s -= 1; g++; }
      el.style.setProperty('font-size', s+'px','important');
    }
    function _remPx(v, fb){ try{ var s=getComputedStyle(document.documentElement).getPropertyValue(v).trim(); var n=parseFloat(s); if(!n) return fb; return s.indexOf('rem')>=0 ? n*16 : n; }catch(e){ return fb; } }
    function fitAll(){
      // Ukuran = pilihan user (Setting → Ukuran Judul/Sub-judul, rem→px). HIBRID: hormati ukuran, wrap maks 2 baris, kecilkan hanya bila masih luber.
      fit(document.getElementById('eventTitle'), _remPx('--title-size-event', 50), 12, 1200);
      fit(document.getElementById('eventSubtitle'), _remPx('--subtitle-size-event', 22), 8, 1040);
    }
    window.__fitTitles = fitAll;
    var raf = function(){ requestAnimationFrame(fitAll); };
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitAll); }
    window.addEventListener('load', raf);
    window.addEventListener('resize', raf);
    ['eventTitle','eventSubtitle'].forEach(function(id){
      var el = document.getElementById(id);
      if (el && window.MutationObserver) new MutationObserver(raf).observe(el, {childList:true, characterData:true, subtree:true});
    });
    // Re-fit saat mode layout berubah (stage-custom on/off) & beberapa pass tertunda utk menangkap applyLayout/ganti tema.
    if (_stg && window.MutationObserver) new MutationObserver(raf).observe(_stg, {attributes:true, attributeFilter:['class']});
    // ResizeObserver: re-fit TEPAT saat kotak item berubah ukuran (applyLayout set lebar box) → tak terpotong di layout custom.
    if (window.ResizeObserver) {
      var _lastW = {};
      var _ro = new ResizeObserver(function(entries){
        var ch=false; for(var i=0;i<entries.length;i++){ var w=Math.round(entries[i].contentRect.width), id=entries[i].target.id; if(_lastW[id]!==w){ _lastW[id]=w; ch=true; } }
        if(ch) raf();
      });
      ['eventTitle','eventSubtitle'].forEach(function(id){ var el=document.getElementById(id); if(el) _ro.observe(el); });
    }
    [80, 300, 700, 1300, 2200].forEach(function(d){ setTimeout(fitAll, d); });
    raf();
  })();
  </script>
